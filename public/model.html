<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>비타오백 인식 · Teachable Machine</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				color-scheme: dark;
				--bg-deep: #0c0f14;
				--bg-card: rgba(22, 27, 38, 0.72);
				--border: rgba(255, 255, 255, 0.08);
				--text: #f1f5f9;
				--muted: #94a3b8;
				--accent: #f59e0b;
				--accent-soft: rgba(245, 158, 11, 0.15);
				--success: #34d399;
				--success-soft: rgba(52, 211, 153, 0.12);
				--neutral: #64748b;
				--neutral-soft: rgba(100, 116, 139, 0.15);
				--glow: rgba(245, 158, 11, 0.35);
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				font-family: "Outfit", system-ui, sans-serif;
				background:
					radial-gradient(
						ellipse 80% 50% at 50% -10%,
						rgba(245, 158, 11, 0.18),
						transparent 55%
					),
					radial-gradient(
						ellipse 60% 40% at 100% 100%,
						rgba(56, 189, 248, 0.08),
						transparent 50%
					),
					linear-gradient(165deg, var(--bg-deep) 0%, #121820 45%, #0f141c 100%);
				color: var(--text);
				line-height: 1.5;
			}

			.page {
				max-width: 960px;
				margin: 0 auto;
				padding: clamp(1.5rem, 4vw, 3rem) 1.25rem 3rem;
			}

			header {
				text-align: center;
				margin-bottom: 2.5rem;
			}

			.badge {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				padding: 0.35rem 0.85rem;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: rgba(255, 255, 255, 0.04);
				font-size: 0.75rem;
				font-weight: 500;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--accent);
				margin-bottom: 1rem;
			}

			.badge-dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 10px var(--glow);
				animation: pulse 2s ease-in-out infinite;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.45;
				}
			}

			h1 {
				margin: 0 0 0.75rem;
				font-size: clamp(1.75rem, 5vw, 2.75rem);
				font-weight: 700;
				letter-spacing: -0.02em;
				line-height: 1.15;
			}

			h1 span {
				background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #fb923c 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}

			.subtitle {
				margin: 0 auto;
				max-width: 32rem;
				color: var(--muted);
				font-size: 1rem;
			}

			.grid {
				display: grid;
				gap: 1.25rem;
			}

			@media (min-width: 768px) {
				.grid {
					grid-template-columns: 1fr 1fr;
					align-items: start;
				}
			}

			.card {
				border: 1px solid var(--border);
				border-radius: 1.25rem;
				background: var(--bg-card);
				backdrop-filter: blur(12px);
				padding: 1.5rem;
				box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
			}

			.card-title {
				margin: 0 0 1rem;
				font-size: 0.8rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.webcam-wrap {
				position: relative;
				aspect-ratio: 1;
				border-radius: 1rem;
				overflow: hidden;
				background:
					linear-gradient(135deg, rgba(255, 255, 255, 0.03), transparent),
					#0a0d12;
				border: 1px dashed rgba(255, 255, 255, 0.12);
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.webcam-wrap.active {
				border-style: solid;
				border-color: rgba(245, 158, 11, 0.35);
				box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.1), 0 0 40px rgba(245, 158, 11, 0.08);
			}

			#webcam-container {
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			#webcam-container canvas {
				width: 100% !important;
				height: 100% !important;
				object-fit: cover;
				display: block;
			}

			.webcam-placeholder {
				text-align: center;
				padding: 2rem;
				color: var(--muted);
			}

			.webcam-placeholder svg {
				width: 3rem;
				height: 3rem;
				margin-bottom: 0.75rem;
				opacity: 0.5;
			}

			.webcam-placeholder p {
				margin: 0;
				font-size: 0.9rem;
			}

			.btn-start {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				width: 100%;
				margin-top: 1rem;
				padding: 0.9rem 1.5rem;
				border: none;
				border-radius: 0.85rem;
				background: linear-gradient(135deg, #fbbf24, #f59e0b);
				color: #1a1206;
				font-family: inherit;
				font-size: 1rem;
				font-weight: 600;
				cursor: pointer;
				transition:
					transform 0.15s ease,
					box-shadow 0.15s ease,
					opacity 0.15s ease;
				box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
			}

			.btn-start:hover:not(:disabled) {
				transform: translateY(-2px);
				box-shadow: 0 8px 28px rgba(245, 158, 11, 0.45);
			}

			.btn-start:active:not(:disabled) {
				transform: translateY(0);
			}

			.btn-start:disabled {
				opacity: 0.55;
				cursor: not-allowed;
				box-shadow: none;
			}

			.result-panel {
				display: flex;
				flex-direction: column;
				gap: 1.25rem;
				min-height: 100%;
			}

			.status-card {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 2rem 1.5rem;
				border-radius: 1rem;
				border: 1px solid var(--border);
				background: rgba(255, 255, 255, 0.02);
				transition:
					background 0.3s ease,
					border-color 0.3s ease,
					box-shadow 0.3s ease;
			}

			.status-card.idle {
				border-color: var(--border);
			}

			.status-card.holding {
				background: var(--success-soft);
				border-color: rgba(52, 211, 153, 0.35);
				box-shadow: 0 0 32px rgba(52, 211, 153, 0.1);
			}

			.status-card.not-holding {
				background: var(--neutral-soft);
				border-color: rgba(100, 116, 139, 0.35);
			}

			.status-card.unknown {
				background: var(--accent-soft);
				border-color: rgba(245, 158, 11, 0.35);
			}

			.status-icon {
				font-size: 3rem;
				line-height: 1;
				margin-bottom: 1rem;
				filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
			}

			#label-container {
				margin: 0;
				font-size: clamp(1.25rem, 3vw, 1.6rem);
				font-weight: 600;
				letter-spacing: -0.01em;
			}

			.hint {
				margin: 0.75rem 0 0;
				font-size: 0.875rem;
				color: var(--muted);
			}

			.prob-list {
				display: grid;
				gap: 0.75rem;
			}

			.prob-item {
				display: grid;
				gap: 0.35rem;
			}

			.prob-header {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				font-size: 0.85rem;
			}

			.prob-label {
				color: var(--text);
				font-weight: 500;
			}

			.prob-value {
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}

			.prob-bar {
				height: 6px;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.06);
				overflow: hidden;
			}

			.prob-fill {
				height: 100%;
				width: 0%;
				border-radius: inherit;
				background: linear-gradient(90deg, #64748b, #94a3b8);
				transition: width 0.2s ease;
			}

			.prob-item.top .prob-fill {
				background: linear-gradient(90deg, #f59e0b, #fbbf24);
			}

			footer {
				margin-top: 2rem;
				text-align: center;
				font-size: 0.8rem;
				color: var(--muted);
			}

			footer a {
				color: var(--accent);
				text-decoration: none;
			}

			footer a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<div class="page">
			<header>
				<div class="badge">
					<span class="badge-dot" aria-hidden="true"></span>
					Teachable Machine
				</div>
				<h1><span>비타오백</span> 인식 데모</h1>
				<p class="subtitle">
					카메라를 켜고 음료를 들어 보세요. AI가 비타오백을 들고 있는지 실시간으로
					판별합니다.
				</p>
			</header>

			<div class="grid">
				<section class="card">
					<h2 class="card-title">Live Camera</h2>
					<div class="webcam-wrap" id="webcam-wrap">
						<div class="webcam-placeholder" id="webcam-placeholder">
							<svg
								xmlns="http://www.w3.org/2000/svg"
								fill="none"
								viewBox="0 0 24 24"
								stroke="currentColor"
								stroke-width="1.5"
								aria-hidden="true"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055L15.75 4.697a2.31 2.31 0 0 0-2.368-1.112 48.08 48.08 0 0 0-3.764 0A2.31 2.31 0 0 0 9.318 4.697L6.827 6.175Z"
								/>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									d="M12 16.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
								/>
							</svg>
							<p>아래 버튼을 눌러 카메라를 시작하세요</p>
						</div>
						<div id="webcam-container"></div>
					</div>
					<button type="button" class="btn-start" id="start-btn" onclick="init()">
						<svg
							width="18"
							height="18"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							aria-hidden="true"
						>
							<polygon points="5 3 19 12 5 21 5 3" />
						</svg>
						카메라 시작
					</button>
				</section>

				<section class="card result-panel">
					<h2 class="card-title">Recognition Result</h2>
					<div class="status-card idle" id="status-card">
						<div class="status-icon" id="status-icon" aria-hidden="true">🥤</div>
						<div id="label-container">대기 중…</div>
						<p class="hint" id="status-hint">카메라가 켜지면 결과가 표시됩니다</p>
					</div>
					<div class="prob-list" id="prob-list" hidden></div>
				</section>
			</div>

			<footer>
				Powered by
				<a
					href="https://teachablemachine.withgoogle.com/"
					target="_blank"
					rel="noopener noreferrer"
					>Teachable Machine</a
				>
				&amp; TensorFlow.js
			</footer>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
		<script type="text/javascript">
			const URL = "./resource/tm-my-image-model/";

			let model, webcam, labelContainer, maxPredictions;
			let probListEl, statusCard, statusIcon, statusHint, startBtn;

			document.addEventListener("DOMContentLoaded", () => {
				labelContainer = document.getElementById("label-container");
				probListEl = document.getElementById("prob-list");
				statusCard = document.getElementById("status-card");
				statusIcon = document.getElementById("status-icon");
				statusHint = document.getElementById("status-hint");
				startBtn = document.getElementById("start-btn");
			});

			async function init() {
				if (startBtn.disabled) return;

				startBtn.disabled = true;
				startBtn.textContent = "모델 불러오는 중…";

				const modelURL = URL + "model.json";
				const metadataURL = URL + "metadata.json";

				model = await tmImage.load(modelURL, metadataURL);
				maxPredictions = model.getTotalClasses();

				const flip = true;
				webcam = new tmImage.Webcam(320, 320, flip);
				await webcam.setup();
				await webcam.play();
				window.requestAnimationFrame(loop);

				document.getElementById("webcam-placeholder").hidden = true;
				document.getElementById("webcam-wrap").classList.add("active");
				document.getElementById("webcam-container").appendChild(webcam.canvas);

				buildProbBars(maxPredictions);

				startBtn.textContent = "실행 중";
				labelContainer.textContent = "분석 중…";
				statusHint.textContent = "카메라 앞에 음료를 보여 주세요";
			}

			function buildProbBars(count) {
				probListEl.innerHTML = "";
				probListEl.hidden = false;

				for (let i = 0; i < count; i++) {
					const item = document.createElement("div");
					item.className = "prob-item";
					item.innerHTML = `
						<div class="prob-header">
							<span class="prob-label" data-label></span>
							<span class="prob-value" data-value>0%</span>
						</div>
						<div class="prob-bar"><div class="prob-fill" data-fill></div></div>
					`;
					probListEl.appendChild(item);
				}
			}

			function setStatus(state, message, hint) {
				statusCard.className = "status-card " + state;
				labelContainer.textContent = message;
				statusHint.textContent = hint;

				const icons = {
					idle: "🥤",
					holding: "✅",
					"not-holding": "🙅",
					unknown: "🤔",
				};
				statusIcon.textContent = icons[state] || "🥤";
			}

			function updateProbBars(prediction) {
				if (!probListEl.children.length) return;

				const sorted = [...prediction].sort((a, b) => b.probability - a.probability);
				const topClass = sorted[0]?.className;

				for (let i = 0; i < prediction.length; i++) {
					const item = probListEl.children[i];
					const p = prediction[i];
					const pct = Math.round(p.probability * 100);

					item.classList.toggle("top", p.className === topClass);
					item.querySelector("[data-label]").textContent = p.className;
					item.querySelector("[data-value]").textContent = pct + "%";
					item.querySelector("[data-fill]").style.width = pct + "%";
				}
			}

			async function loop() {
				webcam.update();
				await predict();
				window.requestAnimationFrame(loop);
			}

			async function predict() {
				const prediction = await model.predict(webcam.canvas);
				updateProbBars(prediction);

				const p0 = prediction[0];
				const p1 = prediction[1];

				if (
					p0.className === "holding-drink" &&
					p0.probability.toFixed(2) == 1.0
				) {
					setStatus(
						"holding",
						"비타오백을 들고 있습니다.",
						"음료가 잘 인식되고 있어요",
					);
				} else if (
					p1.className === "non-drink" &&
					p1.probability.toFixed(2) == 1.0
				) {
					setStatus(
						"not-holding",
						"비타오백을 들고 있지 않습니다.",
						"음료를 카메라 중앙에 맞춰 보세요",
					);
				} else {
					setStatus(
						"unknown",
						"모르겠습니다.",
						"조명과 각도를 조절해 보세요",
					);
				}
			}
		</script>
	</body>
</html>
